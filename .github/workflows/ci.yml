name: CI
on:
  pull_request: # Run on all PR changes
    types: [opened, synchronize, reopened, labeled]
  push: # Run on all changes to main (includes PR merges)
    branches:
      - main
  schedule: # Scheduled workflows will only run on the default branch
    - cron: "50 23 * * *" # 11:50pm daily (to get ahead of all those midnight jobs)

jobs:
  # Verify that the package builds successfully
  # For PRs: only runs if the cibuild label is present
  # Also runs on push to main and scheduled runs
  build-package:
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'cibuild')) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule'
    name: Build
    uses: ./.github/workflows/_build.yml

  # Run unit and integration tests
  run-tests:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      # For codecov OIDC verifications
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          # We need the full history to generate the proper version number
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,xarray]"

      - name: Testing
        run: |
          pytest --color=yes --cov --cov-report=xml --benchmark-disable

      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true

      - name: Benchmark regression gate
        # Linux only: thresholds are calibrated for ubuntu-latest runners (see
        # docs/source/developers.md#benchmarks). Runs outside of coverage
        # instrumentation, which distorts timings.
        id: benchmark_gate
        if: matrix.os == 'ubuntu-latest'
        env:
          SPP_BENCHMARK_GATE: "1"
        run: |
          pytest tests/benchmark/ --color=yes --benchmark-json=benchmark.json

      - name: Record benchmark numbers
        # Runs even if the gate failed, since that is when the numbers matter most.
        if: ${{ !cancelled() && steps.benchmark_gate.outcome != 'skipped' }}
        run: |
          python - <<'EOF'
          import json
          import os
          import sys

          with open("benchmark.json") as f:
              data = json.load(f)

          lines = [
              f"### Benchmark results — Python {sys.version_info.major}.{sys.version_info.minor}",
              "",
              "Thresholds compare against the normalized mean (mean / speed factor).",
              "",
              "| Test | Normalized mean (s) | Speed factor | Mean (s) | Min (s) | Max (s) | Rounds |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for bench in sorted(data["benchmarks"], key=lambda b: b["name"]):
              stats = bench["stats"]
              factor = bench.get("extra_info", {}).get("speed_factor", 1.0)
              lines.append(
                  f"| `{bench['name']}` | {stats['mean'] / factor:.9f} | {factor:.3f} | {stats['mean']:.9f} | "
                  f"{stats['min']:.9f} | {stats['max']:.9f} | {stats['rounds']} |"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n\n")
          EOF

      - name: Upload benchmark numbers
        # Same data as the step summary, in machine-readable form for recalibration.
        if: ${{ !cancelled() && steps.benchmark_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-py${{ matrix.python-version }}-attempt${{ github.run_attempt }}
          path: benchmark.json
          retention-days: 30
          if-no-files-found: ignore

  # Run the example scripts and ensure there are no errors
  run-examples:
    name: Run Examples
    runs-on: ubuntu-latest
    permissions:
      contents: read # Minimal permissions required for checkout
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[examples]"

      - name: Test examples
        env:
          MPLBACKEND: Agg # Use non-interactive backend for matplotlib
        run: |
          cd examples
          for example in *.py; do
            echo "Testing $example..."
            python "$example" || { echo "Example $example failed"; exit 1; }
            echo "Example $example passed"
          done
